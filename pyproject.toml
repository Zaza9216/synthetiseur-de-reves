[project]
name = "synthetiseur-de-reves"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "gunicorn>=27.0.1",
    "openai>=3.50.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/migrations/*", "config/asgi.py", "config/wsgi.py", "manage.py", ".venv/*"]

[tool.coverage.report]
fail_under = 70
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W : PEP 8 · F : erreurs · I : imports · D : docstrings Google · UP : syntaxe moderne · B : bugs courants · DJ : Django
select = ["E", "W", "F", "I", "D", "UP", "B", "DJ"]
ignore = ["D100", "D104", "D105", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
