# Lancement local complet (application + PostgreSQL) : docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dreams
      POSTGRES_USER: dreams
      POSTGRES_PASSWORD: dreams
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreams"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://dreams:dreams@db:5432/dreams
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
