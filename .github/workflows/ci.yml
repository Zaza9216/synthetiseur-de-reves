name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dreams
          POSTGRES_USER: dreams
          POSTGRES_PASSWORD: dreams
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dreams"
          --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://dreams:dreams@localhost:5432/dreams
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-a-long-random-looking-key-0123456789-abcdefghijklmnopqrstuvwxyz
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t synthetiseur-de-reves .

  deploy:
    name: Déploiement Render
    runs-on: ubuntu-latest
    needs: [lint, tests, docker]
    # Uniquement après un merge sur main, jamais sur une Pull Request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Déclencher le déploiement
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK_URL absent : déploiement ignoré."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
          echo "Déploiement demandé à Render pour le commit ${GITHUB_SHA::7}."

      - name: Vérifier la mise en ligne (smoke test)
        env:
          APP_URL: ${{ vars.APP_URL }}
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::APP_URL ou RENDER_DEPLOY_HOOK_URL absent : vérification ignorée."
            exit 0
          fi
          expected="${GITHUB_SHA::7}"
          # Le build Docker et le démarrage prennent quelques minutes sur l'offre gratuite.
          for attempt in $(seq 1 60); do
            version=$(curl --silent --max-time 10 "$APP_URL/health/" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            if [ "$version" = "$expected" ]; then
              echo "✅ Version $expected en ligne sur $APP_URL"
              exit 0
            fi
            echo "Tentative $attempt/60 : version en ligne « ${version:-indisponible} », attendue « $expected »"
            sleep 15
          done
          echo "::error::La version $expected n'est pas en ligne après 15 minutes."
          exit 1
