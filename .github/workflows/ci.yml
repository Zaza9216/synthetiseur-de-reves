name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dreams
          POSTGRES_USER: dreams
          POSTGRES_PASSWORD: dreams
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dreams"
          --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://dreams:dreams@localhost:5432/dreams
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-a-long-random-looking-key-0123456789-abcdefghijklmnopqrstuvwxyz
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t synthetiseur-de-reves .
