{# Image du rêve, ou ciel de remplacement teinté par l'émotion. Attend `dream` (et `ratio`, `img_class`). #}
{% if dream.image %}
  <div class="ratio ratio-{{ ratio|default:'4x3' }} overflow-hidden {{ img_class|default:'card-img-top' }}">
    <img src="{{ dream.image.url }}" class="w-100 h-100 object-fit-cover"
         alt="Illustration générée du rêve : {{ dream.title }}" loading="lazy">
  </div>
{% else %}
  <div class="ratio ratio-{{ ratio|default:'4x3' }} dream-placeholder {{ img_class|default:'card-img-top' }}" style="--emo: {{ dream.emotion_style.hex }}">
    <div class="d-flex align-items-center justify-content-center">
      <i class="bi {{ dream.emotion_style.icon }} display-4" aria-hidden="true"></i>
    </div>
  </div>
{% endif %}
